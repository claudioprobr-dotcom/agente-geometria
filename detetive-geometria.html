<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Detetive das Formas Geométricas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #5B2C8E;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .lupa {
            font-size: 3em;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .pistas-box {
            background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B2 100%);
            padding: 25px;
            border-radius: 20px;
            border: 3px solid #FF6F00;
            min-height: 300px;
        }

        .pistas-box h2 {
            color: #E65100;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .pista {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 15px;
            border-left: 5px solid #FF6F00;
            animation: slideIn 0.5s ease-out;
            font-size: 1.1em;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .canvas-box {
            background: white;
            border-radius: 20px;
            border: 3px solid #7E57C2;
            padding: 20px;
            text-align: center;
        }

        canvas {
            border: 2px dashed #B39DDB;
            border-radius: 10px;
            background: #FAFAFA;
        }

        .opcoes-box {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .btn-forma {
            padding: 20px;
            font-size: 1.2em;
            border: 3px solid #7E57C2;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Comic Sans MS', cursive;
            font-weight: bold;
            color: #5B2C8E;
        }

        .btn-forma:hover {
            background: #7E57C2;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(126,87,194,0.3);
        }

        .btn-forma:active {
            transform: scale(0.95);
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: linear-gradient(135deg, #E8EAF6 0%, #C5CAE9 100%);
            border-radius: 15px;
        }

        .status-item {
            text-align: center;
        }

        .status-label {
            font-size: 0.9em;
            color: #5B2C8E;
        }

        .status-value {
            font-size: 2em;
            font-weight: bold;
            color: #7E57C2;
        }

        .mensagem {
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            border-radius: 20px;
            font-size: 1.3em;
            font-weight: bold;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .acerto {
            background: linear-gradient(135deg, #C8E6C9 0%, #A5D6A7 100%);
            color: #1B5E20;
            border: 3px solid #4CAF50;
        }

        .erro {
            background: linear-gradient(135deg, #FFCDD2 0%, #EF9A9A 100%);
            color: #B71C1C;
            border: 3px solid #F44336;
        }

        .btn-novo-jogo {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.3em;
            background: linear-gradient(135deg, #FF6F00 0%, #FF8F00 100%);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Comic Sans MS', cursive;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-novo-jogo:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255,111,0,0.4);
        }

        .confete {
            position: fixed;
            pointer-events: none;
            animation: cair 3s linear;
        }

        @keyframes cair {
            0% { transform: translateY(-100vh) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(720deg); }
        }

        .nivel-estrela {
            color: #FFD700;
            font-size: 1.5em;
        }

        @media (max-width: 600px) {
            .game-area {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lupa">🔍</div>
            <h1>Detetive das Formas Geométricas</h1>
            <p style="color: #666;">Use as pistas para descobrir a forma misteriosa!</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-label">⭐ Nível</div>
                <div class="status-value" id="nivel">1</div>
            </div>
            <div class="status-item">
                <div class="status-label">🏆 Pontos</div>
                <div class="status-value" id="pontos">0</div>
            </div>
            <div class="status-item">
                <div class="status-label">✅ Acertos</div>
                <div class="status-value" id="acertos">0</div>
            </div>
        </div>

        <div class="game-area">
            <div class="pistas-box">
                <h2>📋 Pistas da Investigação</h2>
                <div id="pistas-container">
                    <p style="color: #999;">Clique em "Novo Caso" para começar!</p>
                </div>
            </div>
            
            <div class="canvas-box">
                <h2 style="color: #7E57C2;">🖼️ Forma Misteriosa</h2>
                <canvas id="canvas" width="300" height="300"></canvas>
                <p style="color: #999; margin-top: 10px;">O desenho aparece quando você resolver!</p>
            </div>
        </div>

        <div id="mensagem-container"></div>

        <div class="opcoes-box" id="opcoes-container">
            <button class="btn-forma" onclick="verificarResposta('quadrado')">⬛ Quadrado</button>
            <button class="btn-forma" onclick="verificarResposta('retangulo')">⬛ Retângulo</button>
            <button class="btn-forma" onclick="verificarResposta('triangulo')">🔺 Triângulo</button>
            <button class="btn-forma" onclick="verificarResposta('pentagono')">⬠ Pentágono</button>
            <button class="btn-forma" onclick="verificarResposta('hexagono')">⬡ Hexágono</button>
        </div>

        <button class="btn-novo-jogo" onclick="novoCaso()">
            🎮 Novo Caso!
        </button>
    </div>

    <script>
        // Dados do jogo
        const formas = {
            quadrado: {
                lados: 4,
                vertices: 4,
                angulos: 'retos (90 graus)',
                caracteristica: 'todos os lados iguais',
                cor: '#42A5F5',
                desenhar: function(ctx) {
                    ctx.fillStyle = this.cor;
                    ctx.fillRect(75, 75, 150, 150);
                }
            },
            retangulo: {
                lados: 4,
                vertices: 4,
                angulos: 'retos (90 graus)',
                caracteristica: 'lados opostos iguais',
                cor: '#66BB6A',
                desenhar: function(ctx) {
                    ctx.fillStyle = this.cor;
                    ctx.fillRect(50, 90, 200, 120);
                }
            },
            triangulo: {
                lados: 3,
                vertices: 3,
                angulos: 'somam 180 graus',
                caracteristica: '3 lados e 3 vértices',
                cor: '#EF5350',
                desenhar: function(ctx) {
                    ctx.fillStyle = this.cor;
                    ctx.beginPath();
                    ctx.moveTo(150, 50);
                    ctx.lineTo(250, 250);
                    ctx.lineTo(50, 250);
                    ctx.closePath();
                    ctx.fill();
                }
            },
            pentagono: {
                lados: 5,
                vertices: 5,
                angulos: 'todos maiores que 90 graus',
                caracteristica: '5 lados iguais',
                cor: '#AB47BC',
                desenhar: function(ctx) {
                    ctx.fillStyle = this.cor;
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        let angle = (i * 2 * Math.PI / 5) - Math.PI / 2;
                        let x = 150 + 100 * Math.cos(angle);
                        let y = 150 + 100 * Math.sin(angle);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
            },
            hexagono: {
                lados: 6,
                vertices: 6,
                angulos: 'todos iguais a 120 graus',
                caracteristica: '6 lados iguais',
                cor: '#FFA726',
                desenhar: function(ctx) {
                    ctx.fillStyle = this.cor;
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        let angle = i * 2 * Math.PI / 6;
                        let x = 150 + 100 * Math.cos(angle);
                        let y = 150 + 100 * Math.sin(angle);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
            }
        };

        let estado = {
            nivel: 1,
            pontuacao: 0,
            acertos: 0,
            formaAtual: null,
            jogoAtivo: false
        };

        function desenharForma(nome) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (nome && formas[nome]) {
                formas[nome].desenhar(ctx);
                
                // Adicionar efeito de revelação
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                setTimeout(() => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    formas[nome].desenhar(ctx);
                }, 100);
            }
        }

        function criarConfetes() {
            const emojis = ['🎉', '⭐', '🌟', '✨', '🎊', '🏆', '💫'];
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const confete = document.createElement('div');
                    confete.className = 'confete';
                    confete.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    confete.style.left = Math.random() * 100 + '%';
                    confete.style.fontSize = (Math.random() * 20 + 15) + 'px';
                    document.body.appendChild(confete);
                    
                    setTimeout(() => confete.remove(), 3000);
                }, i * 100);
            }
        }

        function mostrarMensagem(texto, tipo) {
            const container = document.getElementById('mensagem-container');
            container.innerHTML = `<div class="mensagem ${tipo}">${texto}</div>`;
        }

        function atualizarStatus() {
            document.getElementById('nivel').textContent = estado.nivel;
            document.getElementById('pontos').textContent = estado.pontuacao;
            document.getElementById('acertos').textContent = estado.acertos;
        }

        function gerarPistas(forma) {
            const dados = formas[forma];
            const pistasContainer = document.getElementById('pistas-container');
            let html = '';
            
            const pistas = [];
            if (estado.nivel >= 1) pistas.push(`🔎 Pista 1: Esta forma tem <strong>${dados.lados} lados</strong>.`);
            if (estado.nivel >= 2) pistas.push(`📍 Pista 2: Ela tem <strong>${dados.vertices} vértices</strong> (pontas).`);
            if (estado.nivel >= 3) pistas.push(`📐 Pista 3: Seus ângulos são <strong>${dados.angulos}</strong>.`);
            if (estado.nivel >= 4) pistas.push(`✨ Pista 4: Característica especial: <strong>${dados.caracteristica}</strong>.`);
            
            pistas.forEach((pista, index) => {
                setTimeout(() => {
                    html += `<div class="pista">${pista}</div>`;
                    pistasContainer.innerHTML = html;
                }, index * 800);
            });
        }

        function novoCaso() {
            const nomesFormas = Object.keys(formas);
            estado.formaAtual = nomesFormas[Math.floor(Math.random() * nomesFormas.length)];
            estado.jogoAtivo = true;
            
            document.getElementById('pistas-container').innerHTML = '';
            document.getElementById('mensagem-container').innerHTML = '';
            
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Desenhar interrogação
            ctx.fillStyle = '#B39DDB';
            ctx.font = '100px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('❓', 150, 170);
            
            gerarPistas(estado.formaAtual);
            atualizarStatus();
        }

        function verificarResposta(resposta) {
            if (!estado.jogoAtivo) {
                mostrarMensagem('🎮 Clique em "Novo Caso" primeiro!', 'erro');
                return;
            }
            
            if (resposta === estado.formaAtual) {
                const pontosGanhos = 10 * estado.nivel;
                estado.pontuacao += pontosGanhos;
                estado.acertos++;
                
                if (estado.nivel < 4) {
                    estado.nivel++;
                }
                
                mostrarMensagem(
                    `✅ PARABÉNS! Você descobriu o ${resposta.toUpperCase()}! ⭐ +${pontosGanhos} pontos!`,
                    'acerto'
                );
                
                desenharForma(resposta);
                criarConfetes();
                estado.jogoAtivo = false;
            } else {
                mostrarMensagem(
                    `❌ Não é o ${resposta}! Pense melhor... Observe as pistas com atenção!`,
                    'erro'
                );
                
                // Vibração para dispositivos móveis
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }
            
            atualizarStatus();
        }

        // Iniciar o jogo
        atualizarStatus();
        novoCaso();
    </script>
</body>
</html>
